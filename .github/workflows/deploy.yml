# Builds the blog and publishes it to GitHub Pages every time you change something on the main branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer change replaces one still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the blog
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        # If you add your own domain later, uncomment these two lines and put it in:
        # env:
        #   SITE_URL: https://www.example.com

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
